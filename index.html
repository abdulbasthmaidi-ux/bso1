            this.projects = JSON.parse(JSON.stringify(INITIAL_PROJECTS));
          }
          this.renderAll();
        },

        save() {
          try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(this.projects));
          } catch (e) {}
        },

        notify(msg) {
          const toast = document.getElementById('toast-container');
          const text = document.getElementById('toast-message');
          if (!toast || !text) return;
          text.textContent = msg;
          toast.classList.remove('hidden');
          toast.classList.add('flex');
          clearTimeout(this._toastTimer);
          this._toastTimer = setTimeout(() => {
            toast.classList.add('hidden');
            toast.classList.remove('flex');
          }, 3500);
        },

        setRole(role) {
          this.currentRole = role;
          const labels = {
            student: 'طالب باحث (عبدالله السعيد)',
            supervisor: 'أستاذ مشرف (أ.د. ريم الخالدي)',
            committee: 'رئيس لجنة المشاريع (د. حسام الشريف)'
          };
          this.notify('تم التبديل إلى منظور: ' + labels[role]);
          this.renderAll();
        },

        navigate(view, projectId = null) {
          this.currentView = view;
          if (projectId) {
            this.activeProjectId = projectId;
          }
          window.scrollTo({ top: 0, behavior: 'smooth' });
          this.renderAll();
        },

        getActiveProject() {
          return this.projects.find(p => p.id === this.activeProjectId) || this.projects[0];
        },

        statusLabel(status) {
          const map = {
            proposal_submitted: 'مقترح قيد المراجعة',
            proposal_approved: 'تم اعتماد المقترح',
            in_progress: 'قيد التنفيذ والتقييم',
            ready_for_defense: 'جاهز للمناقشة العلنية',
            defended_passed: 'تمت المناقشة بنجاح'
          };
          return map[status] || status;
        },

        renderHeader() {
          const navItems = [
            { id: 'dashboard', label: 'الرئيسية', icon: '<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>' },
            { id: 'projects', label: 'المشاريع', icon: '<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/></svg>' },
            { id: 'defense_schedule', label: 'المناقشات', icon: '<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>' },
            { id: 'reports', label: 'التقارير', icon: '<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>' }
          ];
          document.getElementById('main-nav').innerHTML = navItems.map(item => `
            <button onclick="app.navigate('${item.id}')" class="py-1 transition-colors whitespace-nowrap text-sm ${
              this.currentView === item.id || (this.currentView === 'project_detail' && item.id === 'projects')
                ? 'text-teal-700 font-bold border-b-2 border-teal-700'
                : 'text-slate-600 hover:text-slate-900'
            }">${item.label}</button>
          `).join('');

          const mobileNav = document.getElementById('mobile-bottom-nav');
          if (mobileNav) {
            mobileNav.innerHTML = navItems.map(item => {
              const isActive = this.currentView === item.id || (this.currentView === 'project_detail' && item.id === 'projects');
              return `
                <button onclick="app.navigate('${item.id}')" class="flex flex-col items-center justify-center gap-1 text-[11px] font-bold transition-colors ${

            { id: 'student', label: 'طالب' },
            { id: 'supervisor', label: 'مشرف' },

            <button onclick="app.setRole('${r.id}')" class="px-2.5 py-1 rounded-md transition-all whitespace-nowrap ${
              this.currentRole === r.id ? 'bg-white text-teal-800 shadow-sm font-bold' : 'text-slate-600 hover:text-slate-900'
            }">${r.label}</button>
          `).join('');

          const mobileRoles = document.getElementById('mobile-role-switcher');
          if (mobileRoles) {
            mobileRoles.innerHTML = roles.map(r => `
              <button onclick="app.setRole('${r.id}')" class="flex-1 py-1 rounded-md text-[11px] text-center transition-all whitespace-nowrap ${
                this.currentRole === r.id ? 'bg-white text-teal-800 shadow-sm font-bold' : 'text-slate-600'
              }">${r.label}</button>
            `).join('');
          }
        },

        renderAll() {
          this.renderHeader();
          const main = document.getElementById('app-main');
          if (this.currentView === 'dashboard') main.innerHTML = this.renderDashboard();
          else if (this.currentView === 'projects') main.innerHTML = this.renderProjectsList();
          else if (this.currentView === 'project_detail') main.innerHTML = this.renderProjectDetail();
          else if (this.currentView === 'defense_schedule') main.innerHTML = this.renderDefenseSchedule();
          else if (this.currentView === 'reports') main.innerHTML = this.renderReports();
        },

        renderDashboard() {
          const totalProjects = this.projects.length;
          const avgProgress = Math.round(this.projects.reduce((s, p) => s + p.progressPercentage, 0) / (totalProjects || 1));
          const totalMeetings = this.projects.reduce((s, p) => s + p.supervisoryMeetings.length, 0);
          const totalDeliverables = this.projects.reduce((s, p) => s + p.deliverables.length, 0);

          return `
            <div class="space-y-8">
              <!-- البانر الترحيبي -->

                <div class="max-w-3xl space-y-4">
                  <div class="text-xs font-semibold tracking-wider text-teal-400">
                    منظومة المتابعة والتحكيم الأكاديمي الموحدة · الفصل الجامعي 2026/2027
                  </div>
                  <h1 class="text-2xl sm:text-3xl lg:text-4xl font-bold tracking-tight text-white">
                    إدارة متكاملة لمسار مشاريع التخرج والأبحاث العلمية

                  <p class="text-sm sm:text-base text-slate-300 leading-relaxed max-w-2xl">

                </div>

                  <div class="text-2xl font-bold text-slate-900">${totalProjects}</div>
                  <div class="text-xs text-slate-500 mt-2">موزعة على الأقسام الأكاديمية</div>
                </div>
                <div class="p-5 bg-white border border-slate-200 rounded-lg shadow-sm">
                  <div class="text-xs text-slate-500 font-medium mb-1">متوسط نسبة الإنجاز العام</div>
                  <div class="text-2xl font-bold text-teal-800">${avgProgress}%</div>
                  <div class="w-full bg-slate-100 rounded-full h-1.5 mt-3 overflow-hidden">
                    <div class="bg-teal-600 h-1.5 rounded-full" style="width: ${avgProgress}%"></div>
                  </div>
                </div>
                <div class="p-5 bg-white border border-slate-200 rounded-lg shadow-sm">
                  <div class="text-xs text-slate-500 font-medium mb-1">التقارير والمخرجات المسلمة</div>
                  <div class="text-2xl font-bold text-amber-700">${totalDeliverables}</div>
                  <div class="text-xs text-slate-500 mt-2">مفحوصة ضد الاستلال العلمي</div>
                </div>
                <div class="p-5 bg-white border border-slate-200 rounded-lg shadow-sm">
                  <div class="text-xs text-slate-500 font-medium mb-1">جلسات الإرشاد الموثقة</div>
                  <div class="text-2xl font-bold text-slate-900">${totalMeetings}</div>
                  <div class="text-xs text-slate-500 mt-2">بمحاضر موقعة رقمياً</div>
                </div>
              </section>

              <!-- قائمة المشاريع السريعة وجدول المناقشات -->
              <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                <section class="lg:col-span-2 space-y-4">
                  <div class="flex items-center justify-between border-b border-slate-200 pb-3">
                    <h2 class="text-lg font-bold text-slate-900">المشاريع الأكاديمية تحت الإشراف</h2>
                    <button onclick="app.navigate('projects')" class="text-xs font-bold text-teal-800 hover:underline">عرض الدليل كاملاً ←</button>
                  </div>
                  <div class="divide-y divide-slate-200 border border-slate-200 rounded-lg bg-white overflow-hidden shadow-sm">
                    ${this.projects.map(p => `
                      <div onclick="app.navigate('project_detail', '${p.id}')" class="p-5 hover:bg-slate-50 transition-colors cursor-pointer group">
                        <div class="flex items-start justify-between gap-4 mb-2">
                          <div>
                            <div class="text-xs text-slate-500 mb-1 flex items-center gap-2">
                              <span class="font-mono font-bold text-teal-800">${p.code}</span>
                              <span>·</span>
                              <span>${p.department}</span>
                            </div>
                            <h3 class="text-base font-bold text-slate-900 group-hover:text-teal-800 transition-colors">${p.title}</h3>
                          </div>
                          <div class="text-left shrink-0">
                            <div class="text-base font-bold text-slate-900">${p.progressPercentage}%</div>
                            <div class="text-xs text-slate-400">إنجاز</div>
                          </div>
                        </div>
                        <p class="text-xs text-slate-600 line-clamp-2 mb-3">${p.abstract}</p>
                        <div class="flex items-center justify-between pt-2 border-t border-slate-100 text-xs text-slate-500">
                          <span>المشرف: <strong class="text-slate-700">${p.supervisor.name}</strong> · ${p.students.length} طلاب</span>
                          <span class="text-teal-800 font-bold">${this.statusLabel(p.status)} ←</span>
                        </div>
                      </div>
                    `).join('')}
                  </div>
                </section>

                <section class="space-y-4">
                  <div class="border border-slate-200 rounded-lg bg-white p-5 shadow-sm space-y-4">
                    <div class="flex items-center justify-between border-b border-slate-100 pb-3">
                      <h3 class="text-sm font-bold text-slate-900">جلسات المناقشة المجدولة</h3>
                      <button onclick="app.navigate('defense_schedule')" class="text-xs text-teal-800 hover:underline">الجدول</button>
                    </div>
                    <div class="space-y-3">
                      ${this.projects.filter(p => p.defenseSchedule).map(p => `
                        <div onclick="app.navigate('project_detail', '${p.id}')" class="p-3 bg-slate-50 rounded-md hover:bg-teal-50/50 cursor-pointer border border-slate-200/70 text-xs space-y-1">
                          <div class="text-teal-800 font-bold flex justify-between">
                            <span>${p.defenseSchedule.date}</span>
                            <span>${p.defenseSchedule.time}</span>
                          </div>
                          <div class="font-bold text-slate-900 line-clamp-1">${p.title}</div>
                          <div class="text-slate-500">${p.defenseSchedule.hall}</div>
                        </div>
                      `).join('')}
                    </div>
                  </div>

                  <div class="border border-slate-200 rounded-lg bg-slate-50 p-4 text-xs text-slate-600 space-y-1.5">
                    <div class="font-bold text-slate-900">ضوابط التسليم والاعتماد الأكاديمي</div>
                    <p class="leading-relaxed">يشترط ألا تتجاوز نسبة الاستلال العلمي 15% في المسودة النهائية للمشروع كشرط أساسي لدخول جلسة المناقشة العلنية.</p>
                  </div>
                </section>
              </div>
            </div>
          `;
        },

        renderProjectsList() {
          const q = this.searchQuery.toLowerCase().trim();
          const filtered = this.projects.filter(p => {
            const matchesSearch = !q || p.title.toLowerCase().includes(q) || p.code.toLowerCase().includes(q) || p.supervisor.name.toLowerCase().includes(q);
            const matchesDept = this.selectedDepartment === 'جميع الأقسام الأكاديمية' || p.department === this.selectedDepartment;
            const matchesStatus = this.selectedStatus === 'all' || p.status === this.selectedStatus;
            return matchesSearch && matchesDept && matchesStatus;
          });

          return `
            <div class="space-y-6">
              <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b border-slate-200 pb-5">
                <div>
                  <h1 class="text-xl sm:text-2xl font-bold text-slate-900">دليل المشاريع والأبحاث الأكاديمية</h1>
                  <div class="text-xs text-slate-500 mt-1">إدارة وتتبع مسارات مشاريع التخرج ورسائل الدراسات العليا المعتمدة</div>
                </div>
                <button onclick="app.openNewProjectModal()" class="px-4 py-2 text-xs font-bold text-white bg-teal-800 hover:bg-teal-900 rounded-lg">
                  + تسجيل مقترح مشروع
                </button>
              </div>

              <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                <input
                  type="text"
                  value="${this.searchQuery}"
                  oninput="app.searchQuery = this.value; app.renderAll();"
                  placeholder="البحث بالرمز، العنوان، أو اسم المشرف..."
                  class="md:col-span-2 px-3.5 py-2 text-xs bg-white border border-slate-200 rounded-lg focus:outline-none focus:border-teal-700"
                />
                <select
                  onchange="app.selectedDepartment = this.value; app.renderAll();"
                  class="px-3 py-2 text-xs bg-white border border-slate-200 rounded-lg focus:outline-none focus:border-teal-700"
                >
                  ${DEPARTMENTS.map(d => `<option value="${d}" ${this.selectedDepartment === d ? 'selected' : ''}>${d}</option>`).join('')}
                </select>
              </div>

              <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                ${filtered.map(p => `
                  <div onclick="app.navigate('project_detail', '${p.id}')" class="bg-white border border-slate-200 rounded-lg p-5 hover:border-teal-700 transition-all cursor-pointer group shadow-sm flex flex-col justify-between">
                    <div>
                      <div class="text-xs text-slate-500 mb-2 flex items-center gap-2">
                        <span class="font-mono font-bold text-teal-800">${p.code}</span>
                        <span>·</span>
                        <span>${p.department}</span>
                      </div>
                      <h3 class="text-base font-bold text-slate-900 group-hover:text-teal-800 mb-2">${p.title}</h3>
                      <p class="text-xs text-slate-600 line-clamp-2 mb-4">${p.abstract}</p>
                      <div class="space-y-1 mb-4">
                        <div class="flex justify-between text-xs text-slate-500">
                          <span>نسبة إنجاز المعالم</span>
                          <span class="font-mono font-bold text-slate-800">${p.progressPercentage}%</span>
                        </div>
                        <div class="w-full bg-slate-100 rounded-full h-1.5 overflow-hidden">
                          <div class="bg-teal-700 h-1.5 rounded-full" style="width: ${p.progressPercentage}%"></div>
                        </div>
                      </div>
                    </div>
                    <div class="pt-3 border-t border-slate-100 text-xs flex justify-between text-slate-500">
                      <span>المشرف: <strong class="text-slate-800">${p.supervisor.name}</strong></span>
                      <span class="text-teal-800 font-bold group-hover:underline">فتح الملف ←</span>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>
          `;
        },

        renderProjectDetail() {
          const p = this.getActiveProject();
          if (!p) return '';
          const tabs = [
            { id: 'milestones', label: `خارطة المراحل والتسليمات (${p.milestones.length})` },
            { id: 'tasks', label: `لوحة المهام (${p.tasks.length})` },
            { id: 'meetings', label: `سجل الجلسات الإرشادية (${p.supervisoryMeetings.length})` },
            { id: 'evaluation', label: `مصفوفة التقييم والدرجات (${p.evaluations.length})` },
            { id: 'overview', label: 'المستخلص والأهداف' }
          ];

          return `
            <div class="space-y-6">
              <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-slate-200 pb-3">
                <button onclick="app.navigate('projects')" class="text-xs font-bold text-slate-600 hover:text-slate-900">
                  → الرجوع إلى دليل المشاريع
                </button>
                <button onclick="app.openOfficialReportModal('${p.id}')" class="px-3.5 py-1.5 text-xs font-bold bg-white border border-slate-200 hover:border-teal-700 text-teal-800 rounded-md shadow-sm">

                <div class="flex flex-col lg:flex-row lg:items-start justify-between gap-4">
                  <div class="space-y-2 max-w-4xl">
                    <div class="text-xs text-slate-500 flex flex-wrap items-center gap-2">
                      <span class="font-mono font-bold text-teal-800 text-sm">${p.code}</span>
                      <span>·</span>
                      <span class="font-medium text-slate-700">${p.department}</span>
                      <span>·</span>
                      <span>${p.term}</span>
                    </div>
                    <h1 class="text-xl sm:text-2xl font-bold text-slate-900 leading-snug">${p.title}</h1>
                    <p class="text-xs text-slate-500 font-sans">${p.titleEn || ''}</p>
                  </div>
                  <div class="bg-slate-50 border border-slate-200 p-4 rounded-lg shrink-0 min-w-[170px] text-left">
                    <div class="text-xs text-slate-500 mb-1">معدل الإنجاز التراكمي</div>
                    <div class="text-3xl font-bold font-mono text-slate-900 mb-2">${p.progressPercentage}%</div>

                  </div>

                    <div class="text-slate-400 mb-1">فريق البحث والطلاب (${p.students.length}):</div>
                    <div class="flex flex-wrap gap-2">

                  </div>
                </div>

                  <button onclick="app.activeTab = '${t.id}'; app.renderAll();" class="py-3 px-3.5 whitespace-nowrap border-b-2 transition-colors shrink-0 ${
                    this.activeTab === t.id ? 'border-teal-800 text-teal-900 bg-teal-50/50 sm:bg-transparent rounded-t-lg' : 'border-transparent text-slate-500 hover:text-slate-800'
                  }">${t.label}</button>
                `).join('')}
              </div>

              <!-- محتوى التبويب النشط -->
              <div>
                ${this.activeTab === 'milestones' ? this.renderMilestonesTab(p) : ''}
                ${this.activeTab === 'tasks' ? this.renderKanbanTab(p) : ''}
                ${this.activeTab === 'meetings' ? this.renderMeetingsTab(p) : ''}
                ${this.activeTab === 'evaluation' ? this.renderEvaluationTab(p) : ''}
                ${this.activeTab === 'overview' ? `
                  <div class="bg-white border border-slate-200 rounded-lg p-6 shadow-sm space-y-5 text-xs leading-relaxed">
                    <div>
                      <h3 class="text-sm font-bold text-slate-900 mb-2">المستخلص الأكاديمي (Abstract):</h3>
                      <p class="text-slate-600 text-sm leading-relaxed">${p.abstract}</p>
                    </div>

        },

        submitDeliverablePrompt(projectId, milestoneId, msTitle) {
          const p = this.projects.find(x => x.id === projectId);
          if (!p) return;
          p.deliverables.unshift({
            id: 'del-' + Date.now(),
            milestoneId,
            title: 'تقرير: ' + msTitle,
            submittedBy: p.students[0]?.name || 'الطالب الباحث',
            submittedAt: new Date().toISOString().split('T')[0],
            version: '1.0',
            fileName: p.code + '_Report.pdf',
            fileSize: '5.4 MB',
            plagiarismSimilarity: 4.9,
            status: 'pending_review',
            feedback: []
          });
          this.save();
          this.renderAll();
          this.notify('تم إيداع التقرير وفحص الاستلال العلمي (4.9%) بنجاح');
        },

        approveDeliverable(projectId, delivId) {
          const p = this.projects.find(x => x.id === projectId);
          if (!p) return;
          const d = p.deliverables.find(x => x.id === delivId);
          if (d) {
            d.status = 'approved';
            d.grade = 95;
            const ms = p.milestones.find(m => m.id === d.milestoneId);
            if (ms) ms.status = 'completed';
            p.progressPercentage = Math.min(100, p.progressPercentage + 15);
          }
          this.save();
          this.renderAll();
          this.notify('تم اعتماد المخرج الأكاديمي ورصد الدرجة بنجاح');
        },

        addTaskPrompt(projectId) {
          const p = this.projects.find(x => x.id === projectId);
          if (!p) return;
          p.tasks.unshift({
            id: 'tsk-' + Date.now(),
            title: 'مراجعة وتدقيق نتائج التجارب المعملية',
            description: 'توثيق الجداول والمقارنات المرجعية في الفصل الرابع',
            assignedTo: p.students[0]?.name || 'الباحث',
            status: 'todo',
            priority: 'high',
            dueDate: '2027-02-18'
          });
          this.save();
          this.renderAll();
          this.notify('تمت إضافة مهمة بحثية جديدة إلى اللوحة');
        },

        advanceTask(projectId, taskId) {
          const p = this.projects.find(x => x.id === projectId);
          if (!p) return;
          const t = p.tasks.find(x => x.id === taskId);
          if (t) {
            t.status = t.status === 'todo' ? 'in_progress' : 'done';
          }
          this.save();
          this.renderAll();
          this.notify('تم تحديث حالة المهمة بنجاح');
        },

        addMeetingPrompt(projectId) {
          const p = this.projects.find(x => x.id === projectId);
          if (!p) return;
          p.supervisoryMeetings.unshift({
            id: 'meet-' + Date.now(),
            date: new Date().toISOString().split('T')[0],
            time: '11:30 ص',
            location: 'مكتب المشرف الأكاديمي',
            agenda: 'متابعة تقدم التجارب العلمية ومراجعة مسودة الفصول',
            outcomes: 'تمت المصادقة على منهجية الاختبار والتوجيه باستكمال فصل المناقشة.',
            actionItems: ['استكمال الرسوم البيانية'],
            nextMeetingDate: '2027-02-22',
            supervisorSignature: true,
            attendedStudents: p.students.map(s => s.name)
          });
          this.save();
          this.renderAll();
          this.notify('تم توثيق محضر الجلسة الإرشادية ومصادقته رقمياً');
        },

        saveEvaluation(projectId) {
          const p = this.projects.find(x => x.id === projectId);
          if (!p) return;
          const c1 = Number(document.getElementById('ev-c1')?.value || 14);
          const c2 = Number(document.getElementById('ev-c2')?.value || 19);
          const c3 = Number(document.getElementById('ev-c3')?.value || 34);
          const c4 = Number(document.getElementById('ev-c4')?.value || 14);
          const c5 = Number(document.getElementById('ev-c5')?.value || 15);
          const notes = document.getElementById('ev-notes')?.value || '';
          const total = Math.min(100, c1 + c2 + c3 + c4 + c5);
          p.evaluations.unshift({
            id: 'ev-' + Date.now(),
            evaluatorName: this.currentRole === 'supervisor' ? p.supervisor.name : 'د. حسام الشريف (رئيس اللجنة)',
            evaluatorRole: this.currentRole,
            totalScore: total,
            feedback: notes,
            submittedAt: new Date().toISOString().split('T')[0]
          });
          this.save();
          this.renderAll();
          this.notify('تم حفظ واعتماد استمارة التقييم الموزون (' + total + '/100)');
        },

        openOfficialReportModal(projectId) {
          const p = this.projects.find(x => x.id === projectId) || this.projects[0];
          const avgEval = p.evaluations.length > 0 ? p.evaluations[0].totalScore : 96;
          document.getElementById('modal-root').innerHTML = `
            <div class="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 bg-slate-900/60 backdrop-blur-xs overflow-y-auto">
              <div class="bg-white rounded-t-2xl sm:rounded-xl border border-slate-200 max-w-3xl w-full max-h-[92vh] overflow-y-auto p-4 sm:p-8 shadow-2xl my-0 sm:my-8 space-y-5 text-slate-900">
                <div class="no-print flex items-center justify-between border-b pb-3 gap-2">
                  <span class="text-xs text-slate-500 font-bold">معاينة وثيقة الاعتماد الرسمية</span>
                  <div class="flex items-center gap-2">
                    <button onclick="window.print()" class="px-3.5 py-2 text-xs font-bold text-white bg-teal-800 rounded-lg">طباعة المستند</button>
                    <button onclick="app.closeModal()" class="p-1.5 text-slate-500 text-base">✕</button>
                  </div>
                </div>
                <div class="space-y-4 border border-slate-300 p-4 sm:p-6 rounded-lg text-xs">
                  <div class="flex flex-col sm:flex-row sm:justify-between gap-2 border-b-2 border-slate-800 pb-4">
                    <div>
                      <div class="font-bold text-sm">المملكة العربية السعودية</div>
                      <div class="font-bold">كلية علوم الحاسب والمعلومات</div>
                      <div>لجنة مشاريع التخرج والدراسات العليا</div>
                    </div>
                    <div class="sm:text-left font-mono">
                      <div>الرقم المرجعي: <strong>${p.code}</strong></div>
                      <div>العام الجامعي: <strong>${p.academicYear}</strong></div>
                    </div>
                  </div>
                  <div class="text-center py-1">
                    <h2 class="text-sm sm:text-base font-bold">محضر اعتماد وتحكيم مشروع التخرج النهائي</h2>
                  </div>
                  <div class="p-3 bg-slate-50 border rounded space-y-1.5 leading-relaxed">
                    <div><strong>عنوان المشروع:</strong> ${p.title}</div>
                    <div><strong>القسم الأكاديمي:</strong> ${p.department} · <strong>المشرف:</strong> ${p.supervisor.name}</div>
                    <div><strong>الطلاب الباحثون:</strong> ${p.students.map(s => s.name + ' (' + s.studentId + ')').join('، ')}</div>
                  </div>
                  <div class="p-3 bg-teal-50 border border-teal-200 rounded flex flex-col sm:flex-row sm:justify-between sm:items-center gap-1 font-bold">
                    <span>الدرجة النهائية المعتمدة والتقدير العام:</span>
                    <span class="font-mono text-sm text-teal-900">${avgEval} / 100 — ممتاز مرتفع (A+)</span>
                  </div>
                  <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 pt-4 text-center border-t">
                    <div class="p-2 bg-slate-50 sm:bg-transparent rounded"><strong>المشرف الأكاديمي</strong><div class="text-teal-800 mt-1">✓ موقع رقمياً</div></div>
                    <div class="p-2 bg-slate-50 sm:bg-transparent rounded"><strong>رئيس لجنة التحكيم</strong><div class="text-teal-800 mt-1">✓ موقع رقمياً</div></div>
                    <div class="p-2 bg-slate-50 sm:bg-transparent rounded"><strong>خاتم عمادة الكلية</strong><div class="text-slate-400 mt-1">معتمد رسمياً</div></div>
                  </div>
                </div>
              </div>
            </div>
          `;
        }
      };

      window.addEventListener('DOMContentLoaded', () => app.init());
    </script>
  </body>
</html>
